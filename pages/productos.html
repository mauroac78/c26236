<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Cerámica Artesanal</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header__container container">
            <a href="../index.html" class="site-header__logo-link">
                <img src="../img/logo.jpeg" alt="Logo de Cerámica Artesanal" class="site-header__logo">
            </a>
            <h1 class="site-header__title">ARTESANO</h1>
            <nav class="site-nav">
                <ul class="site-nav__list">
                    <li><a href="../index.html" class="site-nav__link">Inicio</a></li>
                    <li><a href="productos.html" class="site-nav__link">Productos</a></li>
                    <li><a href="contacto.html" class="site-nav__link">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <h2 class="section-title">Nuestros Productos</h2>

            <section class="info-section">
                <h2 class="info-section__title">Precios y stock</h2>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
            </section>

            <section class="info-section">
                <h2 class="info-section__title">Detalle de Productos</h2>
                <div id="tarjetas" class="cards"></div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p><a href="mailto:mauroalexis@gmail.com" class="site-footer__link">Mauro Colombini</a> - ARTESANO</p>
        </div>
    </footer>

    <script type="module" src="../js/productos.js"></script>
</body>
</html>
